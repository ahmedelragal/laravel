version: 0.2

phases:
  install:
    runtime-versions:
      php: 8.2
      nodejs: 18
    commands:
      - echo "Installing Composer..."
      - curl -sS https://getcomposer.org/installer | php
      - mv composer.phar /usr/local/bin/composer
      - echo "Installing PHP dependencies..."
      - composer install --no-interaction --prefer-dist --optimize-autoloader

      # Optional: Install frontend dependencies if you use Laravel Mix/Vite
      - echo "Installing Node.js dependencies..."
      - npm install
      - npm run build

  pre_build:
    commands:
      - echo "Running Laravel pre-build steps..."
      - cp .env.example .env
      - ls -la
      - php artisan key:generate
      - php artisan config:clear
      - php artisan config:cache
      - php artisan route:cache
      - php artisan view:cache
      - mkdir -p storage/framework/{cache,sessions,views}
      - chmod -R 775 storage bootstrap/cache

  build:
    commands:
      - echo "Build phase (nothing custom here)..."

  post_build:
    commands:
      - echo "Preparing build artifacts..."
      - mkdir -p build
      - zip -r build/laravel-app.zip . -x "node_modules/*" "tests/*" "build/*" ".git/*"

artifacts:
  files:
    - build/laravel-app.zip
